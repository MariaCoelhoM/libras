<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libras - demo</title>
<style>
  :root { --bg: #ffffff; --fg: #1b1b1f; --muted: #6b6b76; --card: #f1f2f5; --accent: #2563eb; --accent-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #ececf0; --muted: #9a9aa5; --card: #23242a; --accent: #60a5fa; --accent-fg: #0b0c0e; }
  }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  .modos { display: flex; gap: 8px; margin-bottom: 12px; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }
  button[aria-pressed="true"], #gravar { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .camera { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 12px; overflow: hidden; }
  video { width: 100%; height: 100%; display: block; transform: scaleX(-1); } /* espelho so na tela */
  .guia { position: absolute; left: 30%; top: 10%; width: 40%; height: 35%; border: 2px dashed rgba(255, 255, 255, 0.7); border-radius: 8px; pointer-events: none; }
  .guia span { position: absolute; top: -22px; left: 0; font-size: 0.75rem; color: #fff; text-shadow: 0 0 4px #000; }
  .painel { background: var(--card); border-radius: 12px; padding: 14px; margin-top: 12px; }
  #resultado { font-size: 2rem; font-weight: 600; min-height: 2.4rem; }
  #confianca, #status, #dica { color: var(--muted); font-size: 0.9rem; margin: 4px 0 0; }
  #gravar { margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Libras - reconhecimento ao vivo</h1>

  <div class="modos">
    <button id="modo-estatico" aria-pressed="true">Alfabeto (estatico)</button>
    <button id="modo-dinamico" aria-pressed="false">Palavras (dinamico)</button>
  </div>

  <div class="camera" id="camera">
    <video id="video" autoplay playsinline muted></video>
    <div class="guia" id="guia" hidden><span>rosto aqui</span></div>
  </div>

  <div class="painel">
    <div id="resultado">-</div>
    <p id="confianca"></p>
    <p id="status">Iniciando a camera...</p>
    <button id="gravar" hidden>Gravar sinal</button>
    <p id="dica" hidden>Fique centralizado, com o rosto dentro da caixa tracejada e os ombros visiveis. Clique em "Gravar sinal", espere a contagem e faca o sinal inteiro.</p>
  </div>
</main>

<script>
  const TOTAL_FRAMES = 30;     // o modelo espera 30 frames por sinal
  const INTERVALO_MS = 100;    // intervalo entre frames na gravacao (30 frames = ~3 s)
  const INTERVALO_ESTATICO_MS = 300;

  const video = document.getElementById("video");
  const camera = document.getElementById("camera");
  const guia = document.getElementById("guia");
  const resultadoEl = document.getElementById("resultado");
  const confiancaEl = document.getElementById("confianca");
  const statusEl = document.getElementById("status");
  const gravarBtn = document.getElementById("gravar");
  const dicaEl = document.getElementById("dica");
  const modoEstaticoBtn = document.getElementById("modo-estatico");
  const modoDinamicoBtn = document.getElementById("modo-dinamico");
  const canvas = document.createElement("canvas");

  let modo = "estatico";
  let gravando = false;

  const dormir = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function mostrar(rotulo, confianca) {
    resultadoEl.textContent = rotulo;
    confiancaEl.textContent = confianca == null ? "" : "confianca: " + (confianca * 100).toFixed(0) + "%";
  }

  function frameBase64() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    // Sem espelhar: o modelo foi treinado com videos nao espelhados
    canvas.getContext("2d").drawImage(video, 0, 0);
    return canvas.toDataURL("image/jpeg", 0.8);
  }

  async function post(url, corpo) {
    const resposta = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo || {}),
    });
    if (!resposta.ok) throw new Error("erro " + resposta.status + " em " + url);
    return resposta.json();
  }

  async function iniciarCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
      video.srcObject = stream;
      await video.play();
      camera.style.aspectRatio = video.videoWidth + " / " + video.videoHeight;
      statusEl.textContent = "Camera pronta.";
    } catch (e) {
      statusEl.textContent = "Nao foi possivel acessar a camera: " + e.message;
    }
  }

  function trocarModo(novo) {
    modo = novo;
    modoEstaticoBtn.setAttribute("aria-pressed", novo === "estatico");
    modoDinamicoBtn.setAttribute("aria-pressed", novo === "dinamico");
    gravarBtn.hidden = guia.hidden = dicaEl.hidden = novo !== "dinamico";
    mostrar("-", null);
    statusEl.textContent = novo === "estatico" ? "Mostre uma letra do alfabeto." : "Pronto para gravar.";
  }

  async function loopEstatico() {
    while (true) {
      if (modo === "estatico" && video.readyState >= 2) {
        try {
          const d = await post("/predict", { image: frameBase64() });
          if (d.detected) {
            mostrar(d.label, d.confidence);
            statusEl.textContent = "Mao detectada.";
          } else {
            mostrar("-", null);
            statusEl.textContent = "Mao nao detectada.";
          }
        } catch (e) {
          statusEl.textContent = e.message;
          await dormir(1000);
        }
      }
      await dormir(INTERVALO_ESTATICO_MS);
    }
  }

  async function gravar() {
    if (gravando) return;
    gravando = true;
    gravarBtn.disabled = true;
    mostrar("-", null);
    try {
      await post("/reset_dinamico");
      for (let i = 3; i > 0; i--) {
        statusEl.textContent = "Prepare-se... " + i;
        await dormir(1000);
      }
      for (let n = 1; n <= TOTAL_FRAMES; n++) {
        const inicio = performance.now();
        statusEl.textContent = "Faca o sinal! frames " + n + "/" + TOTAL_FRAMES;
        const d = await post("/predict_dinamico", { image: frameBase64() });
        if (d.ready) {
          mostrar(d.label, d.confidence);
          statusEl.textContent = "Pronto. Clique em gravar para tentar de novo.";
          break;
        }
        await dormir(Math.max(0, INTERVALO_MS - (performance.now() - inicio)));
      }
    } catch (e) {
      statusEl.textContent = "Erro: " + e.message;
    } finally {
      gravando = false;
      gravarBtn.disabled = false;
    }
  }

  modoEstaticoBtn.addEventListener("click", () => trocarModo("estatico"));
  modoDinamicoBtn.addEventListener("click", () => trocarModo("dinamico"));
  gravarBtn.addEventListener("click", gravar);

  iniciarCamera().then(() => {
    trocarModo("estatico");
    loopEstatico();
  });
</script>
</body>
</html>
